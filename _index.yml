indexpage:
  title: ONTAP Mediator Dokumentation
  summary: ONTAP Mediator unterstützt ONTAP Funktionen durch die Bereitstellung eines
    persistenten und abgegrenzten Speichers für Hochverfügbarkeitsmetadaten (HA),
    durch eine synchrone Funktion zur Abfrage des Node-Systemstatus zur Unterstützung
    der Quorumbestimmung sowie als Ping-Proxy für die Controller-Erreichbarkeit.
  keywords: mediator, ONTAP, high-availability, HA, metadata, quorum, controller,
    liveliness, smbc, metrocluster, snapmirrror active sync
  lead: ONTAP Mediator unterstützt SnapMirror active sync und MetroCluster IP, indem
    ein persistenter und geschützter Speicher für Metadaten zur Hochverfügbarkeit
    (HA) bereitgestellt wird, eine synchrone Abfrage des Node-Systemstatus zur Unterstützung
    der Quorumbestimmung erfolgt und ein Ping-Proxy für die Controller-Verfügbarkeit
    bereitgestellt wird.
